spring.application.name=siw-festival

# ===============================
# Datasource (PostgreSQL)
# ===============================
spring.jpa.database=POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/festival
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===============================
# Hibernate & Logging
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# JWT (autenticazione della parte REST usata da React)
# ===============================
# HMAC-SHA256 richiede una chiave di almeno 256 bit: questa stringa deve
# restare lunga almeno 32 caratteri, altrimenti l'applicazione non parte.
# In un progetto reale non starebbe qui ma in una variabile d'ambiente.
app.jwt.secret=siw-festival-chiave-di-firma-jwt-2026-uniroma3-cambiami
# durata del token: 24 ore, espresse in millisecondi
app.jwt.expiration-ms=86400000

# ===============================
# Swagger / OpenAPI
# ===============================
# Interfaccia su http://localhost:8080/swagger-ui.html
# Specifica JSON su http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# ordina gli endpoint per percorso invece che nell'ordine di scoperta
springdoc.swagger-ui.operationsSorter=method

# ===============================
# Web Server & Thymeleaf
# ===============================
server.port=8080
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
# In sviluppo il browser non deve mettere in cache CSS e immagini:
# da rimuovere (o alzare) in produzione.
spring.web.resources.cache.period=0
spring.thymeleaf.encoding=UTF-8

# ===============================
# Upload delle locandine
# ===============================
# Cartella in cui finiscono i file caricati, relativa alla directory da cui si
# avvia l'applicazione. Viene creata all'avvio se non esiste ed e' esclusa da
# git: i file caricati sono dati, non codice.
app.uploads.directory=uploads/posters
# Oltre questa soglia la richiesta viene respinta con MaxUploadSizeExceededException.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# NOTA: superato il limite, la richiesta viene interrotta da Tomcat mentre il
# filtro CSRF sta leggendo il token dal corpo multipart, cioe' prima che Spring
# MVC scelga un controller. Nessun @ExceptionHandler puo' quindi intercettarla:
# il messaggio per l'utente sta in templates/error/413.html, che Spring Boot
# usa proprio perche' si chiama come lo stato HTTP restituito.
