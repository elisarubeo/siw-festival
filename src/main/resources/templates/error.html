<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<!-- Pagina di errore generica: Spring Boot la usa come ripiego per
     qualunque stato HTTP per cui non esista un template piu' specifico. -->

<head th:replace="~{fragments/layout :: head('Errore')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container my-5 text-center">

        <p class="display-1 fw-bold text-body-tertiary mb-0"
           th:text="${status} ?: 'Errore'">500</p>

        <h1 class="h3 mb-3" th:text="${error} ?: 'Si è verificato un errore'">
            Si &egrave; verificato un errore
        </h1>

        <p class="text-body-secondary" th:if="${path}">
            Percorso richiesto: <code th:text="${path}">/login</code>
        </p>

        <a th:href="@{/}" class="btn btn-dark mt-3">Torna alla home</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
