<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<!--
  Frammenti riutilizzabili da tutte le pagine.
  Uso: <head th:replace="~{fragments/layout :: head('Titolo pagina')}"></head>
-->

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'SIW Festival &middot; ' + ${pageTitle}">SIW Festival</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- il parametro v cambia l'URL a ogni modifica del foglio di stile,
         cosi' il browser e' costretto a riscaricarlo invece di usare la cache -->
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">SIW Festival</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Apri il menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/festivals}">Festival</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/movies}">Film</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/screenings}">Programma</a>
                </li>

                <!-- Voce visibile solo agli amministratori. La proiezione .![authority]
                     trasforma la lista di GrantedAuthority in una lista di stringhe. -->
                <li class="nav-item dropdown"
                    th:if="${userDetails != null
                            and #lists.contains(userDetails.authorities.![authority], 'ADMIN')}">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">Gestione</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/directors}">Registi</a></li>
                        <li><a class="dropdown-item" th:href="@{/theaters}">Sale</a></li>
                    </ul>
                </li>
            </ul>
            <!-- userDetails arriva da GlobalController, che lo aggiunge al model
                 di ogni richiesta: e' null quando nessuno ha fatto login. -->
            <ul class="navbar-nav align-items-md-center">

                <li class="nav-item" th:if="${userDetails == null}">
                    <a class="nav-link" th:href="@{/login}">Accedi</a>
                </li>

                <li class="nav-item" th:unless="${userDetails == null}">
                    <span class="navbar-text me-2" th:text="${userDetails.username}">username</span>
                </li>

                <li class="nav-item" th:unless="${userDetails == null}">
                    <!-- Il logout dev'essere una POST: con CSRF attivo Spring
                         Security rifiuta il logout via GET. La form fa anche
                         includere automaticamente il token. -->
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">Esci</button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="footer mt-5 py-4 bg-dark text-white-50">
    <div class="container d-flex flex-wrap justify-content-between">
        <span>SIW Festival &mdash; Sistemi Informativi su Web, a.a. 2025/2026</span>
        <span>Universit&agrave; degli Studi Roma Tre</span>
    </div>
</footer>

<!-- Messaggi di esito che arrivano da un redirect (RedirectAttributes).
     Uso: <div th:replace="~{fragments/layout :: flash}"></div> -->
<div th:fragment="flash">
    <div th:if="${successMessage}" class="alert alert-success" role="alert"
         th:text="${successMessage}">esito</div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert"
         th:text="${errorMessage}">errore</div>
</div>

<!-- Pulsanti Modifica ed Elimina, mostrati solo agli amministratori.
     basePath e' per esempio "/directors", id l'identificativo dell'entita'.
     L'eliminazione e' una form POST perche' cambia lo stato del sistema. -->
<div th:fragment="adminActions(basePath, id, confirmText)" class="d-inline-flex gap-2"
     th:if="${userDetails != null
             and #lists.contains(userDetails.authorities.![authority], 'ADMIN')}">
    <a class="btn btn-sm btn-outline-dark position-relative"
       th:href="@{{base}/{id}/edit(base=${basePath}, id=${id})}">Modifica</a>
    <!-- Il messaggio di conferma sta in un attributo data-, non in onsubmit:
         Thymeleaf non permette di costruire gestori di eventi da variabili.
         Se ne occupa lo script in fondo alla pagina. -->
    <form th:action="@{{base}/{id}/delete(base=${basePath}, id=${id})}" method="post"
          class="position-relative" th:data-confirm="${confirmText}">
        <button type="submit" class="btn btn-sm btn-outline-danger">Elimina</button>
    </form>
</div>

<!-- Badge colorato per lo stato di una proiezione, usato in piu' pagine.
     Uso: <td th:replace="~{fragments/layout :: statusBadge(${screening.status})}"></td> -->
<td th:fragment="statusBadge(status)" th:switch="${status.name()}">
    <span th:case="'SCHEDULED'" class="badge text-bg-success">In programma</span>
    <span th:case="'COMPLETED'" class="badge text-bg-secondary">Conclusa</span>
    <span th:case="'CANCELLED'" class="badge text-bg-danger">Annullata</span>
    <span th:case="*" class="badge text-bg-light" th:text="${status}">stato</span>
</td>

<!-- Serve per il menu a scomparsa su schermi stretti -->
<div th:fragment="scripts">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script>
        // Chiede conferma prima di inviare le form con attributo data-confirm
        document.querySelectorAll('form[data-confirm]').forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!window.confirm(form.dataset.confirm)) {
                    event.preventDefault();
                }
            });
        });
    </script>
</div>

</body>
</html>
