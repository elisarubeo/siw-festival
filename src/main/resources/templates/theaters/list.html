<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Sale')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container my-5">

        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="h2 mb-0">Sale</h1>
            <a th:href="@{/theaters/new}" class="btn btn-dark">Nuova sala</a>
        </div>

        <div th:if="${#lists.isEmpty(theaters)}" class="alert alert-secondary">
            Non ci sono sale registrate nel sistema.
        </div>

        <div th:unless="${#lists.isEmpty(theaters)}"
             class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

            <div class="col" th:each="theater : ${theaters}">
                <article class="card h-100">
                    <div class="card-body">

                        <h2 class="card-title h5 mb-1">
                            <a class="stretched-link"
                               th:href="@{/theaters/{id}(id=${theater.id})}"
                               th:text="${theater.name}">Nome della sala</a>
                        </h2>

                        <p class="card-subtitle text-body-secondary mb-2"
                           th:text="${theater.address}">Via Roma 1, Roma</p>

                        <p class="card-text mb-0">
                            <span class="badge text-bg-light border"
                                  th:text="${theater.capacity} + ' posti'">200 posti</span>
                        </p>

                    </div>
                </article>
            </div>

        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
