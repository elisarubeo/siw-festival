<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Nuova sala')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/theaters}">Sale</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Nuova</li>
                    </ol>
                </nav>

                <h1 class="h3 mb-4">Nuova sala</h1>

                <form th:action="@{/theaters}" th:object="${theater}" method="post">

                    <div class="mb-3">
                        <label for="name" class="form-label">Nome</label>
                        <input type="text" id="name" class="form-control"
                               th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}">errore</div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Indirizzo</label>
                        <input type="text" id="address" class="form-control"
                               th:field="*{address}"
                               th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{address}">errore</div>
                    </div>

                    <div class="mb-4">
                        <label for="capacity" class="form-label">Capienza</label>
                        <input type="number" id="capacity" class="form-control" min="1"
                               th:field="*{capacity}"
                               th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{capacity}">errore</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark">Salva</button>
                        <a th:href="@{/theaters}" class="btn btn-outline-secondary">Annulla</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
