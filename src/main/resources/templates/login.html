<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Accedi')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-9 col-md-6 col-lg-4">

                <h1 class="h3 mb-4 text-center">Accedi</h1>

                <!-- Spring Security reindirizza qui con ?error=true quando
                     l'autenticazione fallisce (vedi failureUrl). -->
                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Username o password non corretti.
                </div>

                <!-- th:action (e non action) e' indispensabile: e' quello che
                     fa aggiungere a Thymeleaf il campo nascosto con il token
                     CSRF, senza il quale Spring Security rifiuta la POST. -->
                <form th:action="@{/login}" method="post">

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username"
                               name="username" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password"
                               name="password" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">Accedi</button>
                </form>

                <p class="text-center text-body-secondary mt-4 mb-0">
                    Non hai un account? <a th:href="@{/register}">Registrati</a>
                </p>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
