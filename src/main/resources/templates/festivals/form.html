<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${festival.id == null} ? 'Nuovo festival' : 'Modifica festival')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/festivals}">Festival</a></li>
                        <li class="breadcrumb-item active" aria-current="page"
                            th:text="${festival.id == null} ? 'Nuovo' : 'Modifica'">Nuovo</li>
                    </ol>
                </nav>

                <h1 class="h3 mb-4"
                    th:text="${festival.id == null} ? 'Nuovo festival' : 'Modifica festival'">Nuovo festival</h1>

                <form method="post" th:object="${festival}"
                      th:action="${festival.id == null}
                                 ? @{/festivals}
                                 : @{/festivals/{id}(id=${festival.id})}">

                    <div class="mb-3">
                        <label for="name" class="form-label">Nome</label>
                        <input type="text" id="name" class="form-control"
                               th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}">errore</div>
                    </div>

                    <div class="row">
                        <div class="col-8 mb-3">
                            <label for="city" class="form-label">Citt&agrave;</label>
                            <input type="text" id="city" class="form-control"
                                   th:field="*{city}"
                                   th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{city}">errore</div>
                        </div>

                        <div class="col-4 mb-3">
                            <label for="year" class="form-label">Anno</label>
                            <input type="number" id="year" class="form-control"
                                   th:field="*{year}"
                                   th:classappend="${#fields.hasErrors('year')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{year}">errore</div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="startDate" class="form-label">Data di inizio</label>
                            <input type="date" id="startDate" class="form-control"
                                   th:field="*{startDate}"
                                   th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{startDate}">errore</div>
                        </div>

                        <div class="col-6 mb-3">
                            <label for="endDate" class="form-label">Data di fine</label>
                            <input type="date" id="endDate" class="form-control"
                                   th:field="*{endDate}"
                                   th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{endDate}">errore</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">
                            Descrizione <span class="text-body-secondary fw-normal">(facoltativa)</span>
                        </label>
                        <textarea id="description" class="form-control" rows="4"
                                  th:field="*{description}"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}">errore</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark">Salva</button>
                        <a th:href="@{/festivals}" class="btn btn-outline-secondary">Annulla</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
