<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Festival')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container my-5">

        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="h2 mb-0">Festival</h1>
            <a th:href="@{/festivals/new}" class="btn btn-dark"
               th:if="${userDetails != null
                       and #lists.contains(userDetails.authorities.![authority], 'ADMIN')}">Nuovo festival</a>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div th:if="${#lists.isEmpty(festivals)}" class="alert alert-secondary">
            Non ci sono festival registrati nel sistema.
        </div>

        <div th:unless="${#lists.isEmpty(festivals)}"
             class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

            <div class="col" th:each="festival : ${festivals}">
                <article class="card h-100">
                    <div class="card-body d-flex flex-column">

                        <h2 class="card-title h5 mb-1">
                            <a class="stretched-link"
                               th:href="@{/festivals/{id}(id=${festival.id})}"
                               th:text="${festival.name}">Nome del festival</a>
                        </h2>

                        <p class="card-subtitle text-body-secondary mb-3">
                            <span th:text="${festival.city}">Roma</span>
                            ·
                            <span th:text="${festival.year}">2026</span>
                        </p>

                        <p class="card-text small text-body-secondary mb-3">
                            <span th:text="${festival.startDate}">2026-09-10</span>
                            &mdash;
                            <span th:text="${festival.endDate}">2026-09-20</span>
                        </p>

                        <p class="card-text" th:if="${festival.description}"
                           th:text="${#strings.abbreviate(festival.description, 140)}">
                            Breve descrizione del festival.
                        </p>

                        <div class="mt-auto pt-2"
                             th:replace="~{fragments/layout :: adminActions('/festivals', ${festival.id}, 'Eliminare questo festival?')}"></div>

                    </div>
                </article>
            </div>

        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
