<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<!-- Richiesta non valida: per esempio un file che non è un'immagine
     utilizzabile, quando arriva per una via che salta i controlli della form. -->

<head th:replace="~{fragments/layout :: head('Richiesta non valida')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container my-5 text-center">
        <p class="display-1 fw-bold text-body-tertiary mb-0">400</p>
        <h1 class="h3 mb-3">Richiesta non valida</h1>
        <p class="text-body-secondary" th:text="${errorMessage}">
            I dati inviati non sono utilizzabili.
        </p>
        <a th:href="@{/}" class="btn btn-dark mt-3">Torna alla home</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
