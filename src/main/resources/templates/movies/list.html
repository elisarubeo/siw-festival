<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Film')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container my-5">

        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="h2 mb-0">Film</h1>
            <a th:href="@{/movies/new}" class="btn btn-dark"
               th:if="${userDetails != null
                       and #lists.contains(userDetails.authorities.![authority], 'ADMIN')}">Nuovo film</a>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div th:if="${#lists.isEmpty(movies)}" class="alert alert-secondary">
            Non ci sono film registrati nel sistema.
        </div>

        <div th:unless="${#lists.isEmpty(movies)}"
             class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

            <div class="col" th:each="movie : ${movies}">
                <article class="card h-100">
                    <div class="card-body d-flex flex-column">

                        <h2 class="card-title h5 mb-1">
                            <!-- stretched-link rende cliccabile tutta la card -->
                            <a class="stretched-link"
                               th:href="@{/movies/{id}(id=${movie.id})}"
                               th:text="${movie.title}">Titolo del film</a>
                        </h2>

                        <p class="card-subtitle text-body-secondary mb-3">
                            <span th:text="${movie.year}">2013</span>
                            <span th:if="${movie.duration}" th:text="' · ' + ${movie.duration} + ' min'"> · 141 min</span>
                        </p>

                        <p class="card-text mb-1" th:if="${movie.director}">
                            di <span th:text="${movie.director.name} + ' ' + ${movie.director.surname}">Regista</span>
                        </p>

                        <p class="card-text small text-body-secondary mb-3" th:if="${movie.country}"
                           th:text="${movie.country}">Italia</p>

                        <p class="mb-3" th:if="${movie.genre}">
                            <span class="badge text-bg-light border" th:text="${movie.genre}">Drammatico</span>
                        </p>

                        <div class="mt-auto pt-2"
                             th:replace="~{fragments/layout :: adminActions('/movies', ${movie.id}, 'Eliminare questo film?')}"></div>

                    </div>
                </article>
            </div>

        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
