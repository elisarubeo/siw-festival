<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Film')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1">
    <div class="container my-5">

        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="h2 mb-0">Film</h1>
            <a th:href="@{/movies/new}" class="btn btn-dark"
               th:if="${userDetails != null
                       and #lists.contains(userDetails.authorities.![authority], 'ADMIN')}">Nuovo film</a>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <!-- Ricerca per titolo, genere o regista. E' una GET perche' non
             modifica nulla: il risultato finisce nell'URL ed e' quindi
             condivisibile e ricaricabile. Per questo non serve il token CSRF. -->
        <form method="get" th:action="@{/movies}" class="row g-2 align-items-end mb-4">
            <div class="col-12 col-sm-7 col-md-5">
                <label for="q" class="form-label small text-body-secondary">
                    Cerca per titolo, genere o regista
                </label>
                <!-- type="search": il browser offre il campo con la crocetta
                     per svuotarlo e la cronologia delle ricerche precedenti. -->
                <input type="search" id="q" name="q" class="form-control"
                       placeholder="Es. Sorrentino, Drammatico, La grande bellezza"
                       th:value="${q}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-dark">Cerca</button>
            </div>
            <!-- Compare solo a ricerca attiva: riporta all'elenco completo -->
            <div class="col-auto" th:if="${q != null and !q.isBlank()}">
                <a th:href="@{/movies}" class="btn btn-outline-secondary">Azzera</a>
            </div>
        </form>

        <p class="text-body-secondary small mb-4"
           th:if="${q != null and !q.isBlank() and !#lists.isEmpty(movies)}">
            <span th:text="${#lists.size(movies)}">3</span>
            <span th:text="${#lists.size(movies) == 1} ? 'film trovato' : 'film trovati'">film trovati</span>
            per <strong th:text="${q}">ricerca</strong>.
        </p>

        <div th:if="${#lists.isEmpty(movies)}" class="alert alert-secondary">
            <!-- Due messaggi diversi: un archivio vuoto e una ricerca senza
                 risultati sono due situazioni che l'utente risolve in modi
                 opposti (aggiungere film / cambiare i termini). -->
            <span th:if="${q == null or q.isBlank()}">
                Non ci sono film registrati nel sistema.
            </span>
            <span th:unless="${q == null or q.isBlank()}">
                Nessun film corrisponde a <strong th:text="${q}">ricerca</strong>.
                Prova con un titolo, un genere o il nome di un regista.
            </span>
        </div>

        <div th:unless="${#lists.isEmpty(movies)}"
             class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4">

            <div class="col" th:each="movie : ${movies}">
                <article class="card h-100">

                    <!-- Il riquadro ha le proporzioni di un manifesto e la
                         locandina lo riempie: vedi .poster in style.css -->
                    <img th:if="${movie.posterFilename}" class="card-img-top poster"
                         th:src="@{/uploads/{file}(file=${movie.posterFilename})}"
                         th:alt="'Locandina di ' + ${movie.title}">

                    <!-- Senza locandina il posto resta comunque occupato,
                         cosi' le card della griglia restano tutte uguali. -->
                    <div th:unless="${movie.posterFilename}"
                         class="card-img-top poster-placeholder d-flex align-items-center
                                justify-content-center bg-body-secondary text-body-secondary small">
                        Nessuna locandina
                    </div>

                    <div class="card-body d-flex flex-column">

                        <h2 class="card-title h5 mb-1">
                            <!-- stretched-link rende cliccabile tutta la card -->
                            <a class="stretched-link"
                               th:href="@{/movies/{id}(id=${movie.id})}"
                               th:text="${movie.title}">Titolo del film</a>
                        </h2>

                        <p class="card-subtitle text-body-secondary mb-3">
                            <span th:text="${movie.year}">2013</span>
                            <span th:if="${movie.duration}" th:text="' · ' + ${movie.duration} + ' min'"> · 141 min</span>
                        </p>

                        <p class="card-text mb-1" th:if="${movie.director}">
                            di <span th:text="${movie.director.name} + ' ' + ${movie.director.surname}">Regista</span>
                        </p>

                        <p class="card-text small text-body-secondary mb-3" th:if="${movie.country}"
                           th:text="${movie.country}">Italia</p>

                        <p class="mb-3" th:if="${movie.genre}">
                            <span class="badge text-bg-light border" th:text="${movie.genre}">Drammatico</span>
                        </p>

                        <div class="mt-auto pt-2"
                             th:replace="~{fragments/layout :: adminActions('/movies', ${movie.id}, 'Eliminare questo film?')}"></div>

                    </div>
                </article>
            </div>

        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
